<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Percurso Animado – MapMove</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#09090f;--surface:#0f0f1b;--border:rgba(255,255,255,0.08);--route:#e63946;--hydra:#29b6f6;--start:#69f0ae;--finish:#ff9800;--text:#f0f0f8;--muted:#64647e;--elev-h:100px;--ctrl-h:72px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#map{position:fixed;top:0;left:0;right:0;bottom:calc(var(--elev-h) + var(--ctrl-h));z-index:0}
.mapboxgl-canvas{outline:none}
.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right{bottom:calc(var(--elev-h) + var(--ctrl-h) + 4px)!important}
#hdr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:linear-gradient(to bottom,rgba(9,9,15,.92) 70%,transparent);display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20;pointer-events:none}
#race-name{pointer-events:auto;background:none;border:none;outline:none;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:900;letter-spacing:-.4px;text-transform:uppercase;color:var(--text);flex:1;min-width:0}
#race-name::placeholder{color:var(--muted)}
#stats{display:flex;gap:14px;flex-shrink:0}
.sv{text-align:right}
.sv-n{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sv-u{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
#empty{position:fixed;top:0;left:0;right:0;bottom:calc(var(--elev-h) + var(--ctrl-h));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:15;pointer-events:none}
#empty.gone{display:none}
.up-btn{pointer-events:auto;background:var(--route);color:#fff;border:none;border-radius:24px;padding:12px 28px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.up-btn:hover{filter:brightness(1.12)}
.up-hint{font-size:13px;color:var(--muted)}
.up-formats{font-size:11px;color:var(--muted);opacity:.6}
#elev-panel{position:fixed;bottom:var(--ctrl-h);left:0;right:0;height:var(--elev-h);background:var(--surface);border-top:1px solid var(--border);overflow:hidden;z-index:10}
#elev-label{position:absolute;top:7px;left:12px;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
#elev-gain{position:absolute;top:7px;right:12px;font-size:11px;color:var(--start);font-family:'Space Grotesk',sans-serif;font-weight:500}
#elev-svg{position:absolute;bottom:0;left:0;right:0;height:76px;overflow:visible}
#elev-progress{position:absolute;top:0;left:0;width:0;height:2px;background:var(--route);z-index:2}
#ctrl{position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;min-height:var(--ctrl-h);background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:0;padding:5px max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));z-index:10}
.ctrl-row{display:flex;align-items:center;gap:5px;width:100%}
.ctrl-row+.ctrl-row{margin-top:4px}
.cb{background:rgba(255,255,255,.07);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;transition:background .15s}
.cb:hover{background:rgba(255,255,255,.13)}
.cb.prime{background:var(--route);width:40px;height:40px}
.cb.prime:hover{filter:brightness(1.12)}
.cb.on{background:rgba(255,255,255,.18);color:#fff}
.csep{width:1px;height:20px;background:var(--border);flex-shrink:0}
#spd{-webkit-appearance:none;appearance:none;width:52px;height:3px;border-radius:2px;background:var(--border);outline:none;flex-shrink:0}
#spd::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--route);cursor:pointer}
#spd-lbl{font-size:11px;color:var(--muted);min-width:20px;font-variant-numeric:tabular-nums}
#presets{display:flex;gap:4px;flex-shrink:0}
.pset{width:16px;height:16px;border-radius:50%;border:none;cursor:pointer;opacity:.6;transition:opacity .15s,transform .15s;flex-shrink:0}
.pset:hover,.pset.on{opacity:1;transform:scale(1.2)}
#color-wrap{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);position:relative;overflow:hidden;cursor:pointer;flex-shrink:0}
#color-pick{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:calc(100% + 8px);height:calc(100% + 8px)}
.hbtn{background:rgba(41,182,246,.12);border:1px solid var(--hydra);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--hydra);cursor:pointer;flex-shrink:0;white-space:nowrap;transition:background .15s}
.hbtn.on{background:rgba(41,182,246,.28)}
.tbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer;flex-shrink:0;white-space:nowrap;transition:background .15s}
.tbtn.on{background:rgba(255,255,255,.15);color:var(--text);border-color:rgba(255,255,255,.25)}
.csp{flex:1}
.stbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:3px 7px;font-size:10px;color:var(--muted);cursor:pointer;flex-shrink:0;white-space:nowrap;transition:background .15s}
.stbtn.on{background:rgba(255,255,255,.15);color:var(--text);border-color:rgba(255,255,255,.25)}
.dot-m{width:14px;height:14px;border-radius:50%;background:#fff;pointer-events:none}
.km-m{background:rgba(0,0,0,.72);color:#fff;font-size:9px;font-weight:700;font-family:'Inter',sans-serif;padding:2px 5px;border-radius:10px;border:1px solid rgba(255,255,255,.25);pointer-events:none;white-space:nowrap}
.hyd-m{width:20px;height:20px;border-radius:50%;background:#29b6f6;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;font-family:'Inter',sans-serif;cursor:pointer;box-shadow:0 0 8px rgba(41,182,246,.5)}
#hydra-tip{position:fixed;bottom:calc(var(--ctrl-h) + var(--elev-h) + 10px);left:50%;transform:translateX(-50%);background:rgba(41,182,246,.92);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;pointer-events:none;z-index:30;white-space:nowrap}
.toast{position:fixed;bottom:calc(var(--ctrl-h) + var(--elev-h) + 52px);left:50%;transform:translateX(-50%);background:rgba(15,15,27,.95);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:20px;font-size:12px;z-index:50;white-space:pre-wrap;max-width:88vw;text-align:center;pointer-events:none;line-height:1.4}
#gpx-file,#kml-file{display:none}

/* ── AVATAR ─────────────────────────────────────────────────────────────── */
#avatar{position:fixed;bottom:calc(var(--ctrl-h) + var(--elev-h) + 10px);left:50%;transform:translateX(-50%);z-index:25;pointer-events:none;width:72px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
#avatar svg{display:block}
/* bounce do corpo inteiro */
#av-body-grp{animation:av-bounce .42s ease-in-out infinite alternate}
@keyframes av-bounce{from{transform:translateY(0)}to{transform:translateY(-5px)}}
/* pernas */
.av-leg-l{transform-box:fill-box;transform-origin:50% 0%;animation:av-leg-l .42s ease-in-out infinite}
.av-leg-r{transform-box:fill-box;transform-origin:50% 0%;animation:av-leg-r .42s ease-in-out infinite}
@keyframes av-leg-l{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
@keyframes av-leg-r{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
/* braços (fase oposta às pernas) */
.av-arm-l{transform-box:fill-box;transform-origin:80% 10%;animation:av-arm-l .42s ease-in-out infinite}
.av-arm-r{transform-box:fill-box;transform-origin:20% 10%;animation:av-arm-r .42s ease-in-out infinite}
@keyframes av-arm-l{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-32deg)}}
@keyframes av-arm-r{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}
/* cabeça leve oscilação */
#av-head{transform-box:fill-box;transform-origin:50% 100%;animation:av-head .84s ease-in-out infinite alternate}
@keyframes av-head{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
/* pausa quando não está rodando */
#avatar.paused #av-body-grp,#avatar.paused .av-leg-l,#avatar.paused .av-leg-r,
#avatar.paused .av-arm-l,#avatar.paused .av-arm-r,#avatar.paused #av-head{animation-play-state:paused}
</style>
</head>
<body>
<input type="file" id="gpx-file" accept=".gpx,.kmz,.kml,application/gpx+xml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml,application/octet-stream,*/*">
<input type="file" id="kml-file" accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml,*/*">

<!-- ── AVATAR ─────────────────────────────────────────────────────────────── -->
<div id="avatar" hidden>
<svg viewBox="0 0 60 112" width="72" height="134" xmlns="http://www.w3.org/2000/svg">
  <!-- sombra no chão -->
  <ellipse cx="30" cy="110" rx="13" ry="3.5" fill="rgba(0,0,0,.35)"/>
  <g id="av-body-grp">
    <!-- PERNA ESQUERDA (começa para trás) -->
    <g class="av-leg-l">
      <rect x="19" y="54" width="11" height="22" rx="5.5" fill="#1565C0"/>
      <rect x="15" y="72" width="10" height="17" rx="5" fill="#1E88E5"/>
      <ellipse cx="17" cy="91" rx="12" ry="5" fill="#111"/>
      <ellipse cx="14" cy="89" rx="5" ry="3" fill="#fff" opacity=".15"/>
    </g>
    <!-- PERNA DIREITA (começa para frente) -->
    <g class="av-leg-r">
      <rect x="30" y="54" width="11" height="22" rx="5.5" fill="#1565C0"/>
      <rect x="35" y="72" width="10" height="17" rx="5" fill="#1E88E5"/>
      <ellipse cx="43" cy="91" rx="12" ry="5" fill="#111"/>
      <ellipse cx="40" cy="89" rx="5" ry="3" fill="#fff" opacity=".15"/>
    </g>
    <!-- SHORTS -->
    <rect x="17" y="50" width="26" height="12" rx="5" fill="#0D47A1"/>
    <!-- CAMISETA -->
    <rect x="15" y="26" width="30" height="28" rx="8" fill="#E53935"/>
    <!-- detalhe lateral camiseta -->
    <rect x="15" y="26" width="5" height="28" rx="4" fill="#B71C1C" opacity=".6"/>
    <rect x="40" y="26" width="5" height="28" rx="4" fill="#B71C1C" opacity=".6"/>
    <!-- número de peito -->
    <rect x="20" y="32" width="20" height="14" rx="3" fill="#fff"/>
    <text x="30" y="43" text-anchor="middle" font-size="9" font-weight="800" fill="#E53935" font-family="Arial,sans-serif">1</text>
    <!-- BRAÇO ESQUERDO (começa para frente — fase oposta à perna esq) -->
    <g class="av-arm-l">
      <rect x="4" y="27" width="12" height="8" rx="4" fill="#E53935"/>
      <rect x="2" y="34" width="10" height="10" rx="5" fill="#FFCCBC"/>
      <circle cx="6" cy="47" r="4.5" fill="#FFCCBC"/>
    </g>
    <!-- BRAÇO DIREITO -->
    <g class="av-arm-r">
      <rect x="44" y="27" width="12" height="8" rx="4" fill="#E53935"/>
      <rect x="48" y="34" width="10" height="10" rx="5" fill="#FFCCBC"/>
      <circle cx="54" cy="47" r="4.5" fill="#FFCCBC"/>
    </g>
    <!-- PESCOÇO -->
    <rect x="25" y="21" width="10" height="7" rx="4" fill="#FFCCBC"/>
    <!-- CABEÇA -->
    <g id="av-head">
      <circle cx="30" cy="13" r="13" fill="#FFCCBC"/>
      <!-- cabelo -->
      <path d="M17 10 Q30 0 43 10 Q40 2 30 1 Q20 2 17 10Z" fill="#2C1810"/>
      <rect x="17" y="7" width="26" height="6" rx="3" fill="#2C1810"/>
      <!-- faixa na cabeça -->
      <path d="M17 10 Q30 6 43 10" stroke="#FDD835" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- olhos -->
      <ellipse cx="25" cy="13" rx="2.8" ry="3.2" fill="#1A1A2E"/>
      <ellipse cx="35" cy="13" rx="2.8" ry="3.2" fill="#1A1A2E"/>
      <circle cx="26" cy="11.5" r="1.1" fill="white"/>
      <circle cx="36" cy="11.5" r="1.1" fill="white"/>
      <!-- sobrancelhas levantadas (expressão de esforço) -->
      <path d="M21.5 8.5 Q25 6.5 28.5 8.5" stroke="#2C1810" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M31.5 8.5 Q35 6.5 38.5 8.5" stroke="#2C1810" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- boca aberta de esforço -->
      <path d="M25.5 19 Q30 23.5 34.5 19" stroke="#C07050" stroke-width="1.5" fill="rgba(180,80,50,.3)" stroke-linecap="round"/>
      <!-- gotas de suor -->
      <ellipse cx="41" cy="8" rx="2" ry="3" fill="#64B5F6" opacity=".8" transform="rotate(20 41 8)"/>
      <ellipse cx="44" cy="13" rx="1.5" ry="2.2" fill="#64B5F6" opacity=".6" transform="rotate(15 44 13)"/>
    </g>
  </g>
</svg>
</div>
<div id="map"></div>

<div id="empty">
  <label class="up-btn" id="btn-up-main" for="gpx-file" style="cursor:pointer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Importar GPX / KMZ
  </label>
  <span class="up-hint">Toque para importar</span>
  <span class="up-formats">GPX · KMZ · KML · Google Maps</span>
</div>

<div id="elev-panel">
  <span id="elev-label">Elevação</span>
  <span id="elev-gain"></span>
  <div id="elev-progress"></div>
  <svg id="elev-svg" preserveAspectRatio="none"></svg>
</div>

<div id="ctrl">
  <div class="ctrl-row">
    <button class="cb prime" id="btn-play">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <button class="cb" id="btn-rst">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5.5"/></svg>
    </button>
    <div class="csep"></div>
    <input type="range" id="spd" min="1" max="8" value="3">
    <span id="spd-lbl">3×</span>
    <div class="csep"></div>
    <button class="tbtn on" id="btn-km">📍 km</button>
    <div class="csp"></div>
    <button class="cb" id="btn-cam2d" title="2D top-down">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
    </button>
    <button class="cb" id="btn-camfollow" title="Follow cam">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="cb" id="btn-cam3d" title="3D tilt">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </button>
    <button class="cb" id="btn-camchase" title="Chase cam (estilo Strava)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
    <div class="csep"></div>
    <label class="cb" id="btn-up" for="gpx-file" title="Importar arquivo" style="cursor:pointer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </label>
  </div>
  <div class="ctrl-row">
    <div id="presets">
      <button class="pset on" style="background:#e63946" data-color="#e63946"></button>
      <button class="pset" style="background:#ff9f1c" data-color="#ff9f1c"></button>
      <button class="pset" style="background:#ffd60a" data-color="#ffd60a"></button>
      <button class="pset" style="background:#06d6a0" data-color="#06d6a0"></button>
      <button class="pset" style="background:#4cc9f0" data-color="#4cc9f0"></button>
      <button class="pset" style="background:#f72585" data-color="#f72585"></button>
      <button class="pset" style="background:#ffffff" data-color="#ffffff"></button>
    </div>
    <div id="color-wrap" style="background:#e63946"><input type="color" id="color-pick" value="#e63946"></div>
    <div class="csep"></div>
    <button class="stbtn on" data-style="mapbox://styles/mapbox/dark-v11">🌑 Escuro</button>
    <button class="stbtn" data-style="mapbox://styles/mapbox/streets-v12">🗺 Rua</button>
    <button class="stbtn" data-style="mapbox://styles/mapbox/satellite-streets-v12">🛰 Satélite</button>
    <button class="stbtn" data-style="mapbox://styles/mapbox/outdoors-v12">🏔 Trilha</button>
    <div class="csep"></div>
    <button class="hbtn" id="btn-hydra">💧 Hidratação</button>
    <div class="csep"></div>
    <button class="tbtn" id="btn-kml">📂 KMZ</button>
  </div>
</div>

<header id="hdr">
  <input id="race-name" type="text" placeholder="Nome da Corrida" maxlength="40">
  <div id="stats">
    <div class="sv"><span class="sv-n" id="s-km">—</span><span class="sv-u">KM</span></div>
    <div class="sv"><span class="sv-n" id="s-el">—</span><span class="sv-u">m ↑</span></div>
  </div>
</header>

<div id="hydra-tip" hidden>Toque no mapa para marcar hidratação · Clique direito remove</div>

<script>
async function initApp(){
  try{const r=await fetch('/api/mapbox-token');const{token}=await r.json();mapboxgl.accessToken=token;}catch(e){}
  startMap();
}

let map;
function startMap(){
map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/dark-v11',center:[-47.25,-23.12],zoom:11,pitch:0,bearing:0,antialias:true});

const S={raw:[],elev:[],cumKm:[],hydra:[],idx:0,distKm:0,playing:false,color:'#e63946',speed:3,hydraMode:false,showKm:true,camMode:'2d',raf:null,dotMarker:null,startMarker:null,finishMarker:null,kmMarkers:[],hydraMarkers:[]};

function emptyLine(){return{type:'Feature',geometry:{type:'LineString',coordinates:[]}};}

map.on('load',()=>{
  map.addSource('route-full',{type:'geojson',data:emptyLine()});
  map.addSource('route-prog',{type:'geojson',data:emptyLine()});
  map.addLayer({id:'route-full-line',type:'line',source:'route-full',paint:{'line-color':'#ffffff','line-width':2,'line-opacity':0.08}});
  map.addLayer({id:'route-glow',type:'line',source:'route-prog',paint:{'line-color':S.color,'line-width':14,'line-opacity':0.22,'line-blur':6}});
  map.addLayer({id:'route-line',type:'line',source:'route-prog',paint:{'line-color':S.color,'line-width':3,'line-cap':'round','line-join':'round'}});
  map.on('click',e=>{
    if(!S.hydraMode||!S.raw.length)return;
    const{lng,lat}=e.lngLat;
    let best=Infinity,bestKm=0;
    S.raw.forEach(([lo,la],i)=>{const d=Math.hypot(lo-lng,la-lat);if(d<best){best=d;bestKm=S.cumKm[i];}});
    S.hydra.push({lo:lng,la:lat,km:bestKm,name:''});
    renderHydraMarkers();
  });
  map.on('contextmenu',e=>{
    e.preventDefault();
    if(!S.hydraMode||!S.hydra.length)return;
    const{lng,lat}=e.lngLat;let best=Infinity,bi=-1;
    S.hydra.forEach((h,i)=>{const d=Math.hypot(h.lo-lng,h.la-lat);if(d<best){best=d;bi=i;}});
    if(bi>=0){S.hydra.splice(bi,1);renderHydraMarkers();}
  });
});

// ── FILE HANDLING ──────────────────────────────────────────────────────────────
function handleFile(f){
  if(!f){showToast('⚠️ Nenhum arquivo recebido');return;}
  const n=f.name.toLowerCase();
  const isGpx=n.endsWith('.gpx')||f.type==='application/gpx+xml';
  const isKmz=n.endsWith('.kmz')||f.type==='application/vnd.google-earth.kmz';
  const isKml=n.endsWith('.kml')||f.type==='application/vnd.google-earth.kml+xml';
  if(isGpx){const r=new FileReader();r.onload=ev=>loadGPX(ev.target.result);r.onerror=()=>showToast('⚠️ Erro ao ler GPX');r.readAsText(f,'UTF-8');}
  else if(isKmz){loadKMZ(f);}
  else if(isKml){const r=new FileReader();r.onload=ev=>importKML(ev.target.result);r.onerror=()=>showToast('⚠️ Erro ao ler KML');r.readAsText(f,'UTF-8');}
  else{
    const r=new FileReader();
    r.onload=ev=>{
      const txt=ev.target.result;
      if(txt.includes('<gpx')||txt.includes('<GPX')){loadGPX(txt);}
      else if(txt.includes('<kml')||txt.includes('<Placemark')){importKML(txt);}
      else{
        const r2=new FileReader();r2.onload=e2=>loadKMZ(new Blob([e2.target.result]));r2.readAsArrayBuffer(f);
      }
    };
    r.onerror=()=>showToast('⚠️ Erro ao ler arquivo');
    r.readAsText(f,'UTF-8');
  }
}

function loadGPX(txt){
  const doc=new DOMParser().parseFromString(txt,'text/xml');
  // getElementsByTagName funciona com namespace (xmlns=...); querySelectorAll pode falhar
  const all=[...doc.getElementsByTagName('trkpt'),...doc.getElementsByTagName('rtept'),...doc.getElementsByTagName('wpt')];
  const pts=all.length?all:[...doc.querySelectorAll('[lat][lon]')];
  const raw=[],elev=[];
  pts.forEach(p=>{
    const lo=parseFloat(p.getAttribute('lon')),la=parseFloat(p.getAttribute('lat'));
    const eleEl=p.getElementsByTagName('ele')[0];
    const el=parseFloat(eleEl?.textContent||0);
    if(!isNaN(lo)&&!isNaN(la)){raw.push([lo,la]);elev.push(isNaN(el)?0:el);}
  });
  if(!raw.length){showToast('⚠️ Nenhum ponto encontrado no GPX');return;}
  init(raw,elev);
}

async function loadKMZ(file){
  try{
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const kf=Object.keys(zip.files).filter(n=>n.match(/\.kml$/i));
    if(!kf.length){showToast('⚠️ Nenhum KML no KMZ');return;}
    await importKML(await zip.files[kf[0]].async('text'));
  }catch(e){showToast('⚠️ Erro ao ler KMZ:\n'+e.message);}
}

async function importKML(kmlText){
  const doc=new DOMParser().parseFromString(kmlText,'text/xml');
  const nlHref=doc.querySelector('NetworkLink Link href,NetworkLink href');
  if(nlHref){
    const url=nlHref.textContent.trim();
    try{
      const fetchUrl=url.startsWith('https://www.google.com/maps/d/kml')?'/api/kml-proxy?url='+encodeURIComponent(url):url;
      const resp=await fetch(fetchUrl);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      return importKML(await resp.text());
    }catch(e){
      showToast('⚠️ Não foi possível carregar o mapa do Google Maps.\n\nExporte manualmente:\n1. Abra o mapa\n2. ⋮ → Exportar KML\n3. Desmarque "manter atualizado"',9000);return;
    }
  }
  // Parse LineString route
  const lsNode=doc.querySelector('LineString coordinates,MultiGeometry LineString coordinates');
  if(lsNode){
    const raw=[],elev=[];
    lsNode.textContent.trim().split(/\s+/).forEach(c=>{const p=c.split(',');const lo=parseFloat(p[0]),la=parseFloat(p[1]),el=parseFloat(p[2]||0);if(!isNaN(lo)&&!isNaN(la)){raw.push([lo,la]);elev.push(isNaN(el)?0:el);}});
    if(raw.length)init(raw,elev);
  }
  // Parse waypoints / hydration
  const newH=[];
  doc.querySelectorAll('Placemark').forEach(pm=>{
    const name=(pm.querySelector('name')?.textContent||'').trim();
    if(/^\d+\.?\d*\s*km$/i.test(name))return;
    const ptc=pm.querySelector('Point coordinates');if(!ptc)return;
    const parts=ptc.textContent.trim().split(/[\s,]+/);
    const lo=parseFloat(parts[0]),la=parseFloat(parts[1]);
    if(isNaN(lo)||isNaN(la))return;
    newH.push({lo,la,km:null,name});
  });
  if(newH.length){
    if(S.raw.length){newH.forEach(h=>{let best=Infinity,bk=0;S.raw.forEach(([rlo,rla],i)=>{const d=Math.hypot(rlo-h.lo,rla-h.la);if(d<best){best=d;bk=S.cumKm[i];}});h.km=bk;});}
    S.hydra.push(...newH);renderHydraMarkers();
    showToast('✅ '+newH.length+' ponto(s) importado(s) do KML');
  }
}

// ── INIT ROUTE ─────────────────────────────────────────────────────────────────
function init(raw,elev){
  S.raw=raw;S.elev=elev||[];S.hydra=[];S.idx=0;S.distKm=0;S.playing=false;
  S.cumKm=[0];
  for(let i=1;i<raw.length;i++){
    const[lo1,la1]=raw[i-1],[lo2,la2]=raw[i];
    const dlat=(la2-la1)*Math.PI/180,dlon=(lo2-lo1)*Math.PI/180;
    const a=Math.sin(dlat/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dlon/2)**2;
    S.cumKm.push(S.cumKm[i-1]+6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
  }
  document.getElementById('empty').classList.add('gone');
  const coords=raw.map(([lo,la])=>[lo,la]);
  if(map.isStyleLoaded())setupRoute(coords);else map.once('style.load',()=>setupRoute(coords));
  drawElevProfile();updateStats();
  const totalKm=S.cumKm[S.cumKm.length-1];
  showToast('✅ '+raw.length+' pontos · '+totalKm.toFixed(1)+' km',3000);
}

function setupRoute(coords){
  map.getSource('route-full')?.setData({type:'Feature',geometry:{type:'LineString',coordinates:coords}});
  map.getSource('route-prog')?.setData(emptyLine());
  const bounds=coords.reduce((b,c)=>b.extend(c),new mapboxgl.LngLatBounds(coords[0],coords[0]));
  map.fitBounds(bounds,{padding:60,pitch:0,bearing:0,duration:800});
  // Start marker
  S.startMarker?.remove();
  const se=Object.assign(document.createElement('div'),{className:'km-m',textContent:'▶ LARGADA'});
  se.style.cssText='background:rgba(105,240,174,.2);border-color:#69f0ae;color:#69f0ae';
  S.startMarker=new mapboxgl.Marker({element:se,anchor:'bottom'}).setLngLat(coords[0]).addTo(map);
  // Finish marker
  S.finishMarker?.remove();
  const fe=Object.assign(document.createElement('div'),{className:'km-m',textContent:'🏁 CHEGADA'});
  fe.style.cssText='background:rgba(255,152,0,.2);border-color:#ff9800;color:#ff9800';
  S.finishMarker=new mapboxgl.Marker({element:fe,anchor:'bottom'}).setLngLat(coords[coords.length-1]).addTo(map);
  // Dot
  S.dotMarker?.remove();
  const de=document.createElement('div');de.className='dot-m';
  de.style.boxShadow='0 0 12px 4px '+S.color;
  S.dotMarker=new mapboxgl.Marker({element:de,anchor:'center'}).setLngLat(coords[0]).addTo(map);
  renderKmMarkers();renderHydraMarkers();
}

function renderKmMarkers(){
  S.kmMarkers.forEach(m=>m.remove());S.kmMarkers=[];
  if(!S.showKm||!S.raw.length)return;
  const total=S.cumKm[S.cumKm.length-1];
  const interval=total<=21.5?1:total<=42.5?2:5;
  for(let km=interval;km<=Math.floor(total);km+=interval){
    const idx=S.cumKm.findIndex(d=>d>=km);
    if(idx<0||idx>=S.raw.length)continue;
    const el=Object.assign(document.createElement('div'),{className:'km-m',textContent:km+' km'});
    S.kmMarkers.push(new mapboxgl.Marker({element:el,anchor:'bottom'}).setLngLat(S.raw[idx]).addTo(map));
  }
}

function renderHydraMarkers(){
  S.hydraMarkers.forEach(m=>m.remove());S.hydraMarkers=[];
  S.hydra.forEach((h,i)=>{
    const lbl=h.name&&h.name.length<=4?h.name:'H'+(i+1);
    const el=Object.assign(document.createElement('div'),{className:'hyd-m',textContent:lbl});
    const popup=new mapboxgl.Popup({offset:14,closeButton:false}).setText(h.name||(h.km!=null?'km '+h.km.toFixed(1):'H'+(i+1)));
    const m=new mapboxgl.Marker({element:el,anchor:'center'}).setLngLat([h.lo,h.la]).setPopup(popup).addTo(map);
    el.addEventListener('click',()=>m.togglePopup());
    S.hydraMarkers.push(m);
  });
}

// ── ANIMATION ──────────────────────────────────────────────────────────────────
function play(){
  if(!S.raw.length)return;
  const total=S.cumKm[S.cumKm.length-1]||0;
  if(S.distKm>=total)S.distKm=0;
  S.playing=true;
  document.getElementById('btn-play').innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  document.getElementById('avatar').classList.remove('paused');
  if(S.raf)cancelAnimationFrame(S.raf);
  S.raf=requestAnimationFrame(animate);
}

function pause(){
  S.playing=false;
  if(S.raf){cancelAnimationFrame(S.raf);S.raf=null;}
  document.getElementById('btn-play').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
  document.getElementById('avatar').classList.add('paused');
}

// km avançados por frame = speed × 0.004 (≈ speed km/min a 60fps)
const KM_PER_SPEED = 0.004;

// desloca [lng,lat] em km na direção bearingDeg (norte=0, leste=90)
function geoOffset(lng,lat,bearingDeg,km){
  const R=6371,d=km/R,b=bearingDeg*Math.PI/180;
  const la1=lat*Math.PI/180,lo1=lng*Math.PI/180;
  const la2=Math.asin(Math.sin(la1)*Math.cos(d)+Math.cos(la1)*Math.sin(d)*Math.cos(b));
  const lo2=lo1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la1),Math.cos(d)-Math.sin(la1)*Math.sin(la2));
  return[lo2*180/Math.PI,la2*180/Math.PI];
}

function distToIdx(d){
  // retorna o índice do ponto mais próximo da distância d (km)
  let lo=0,hi=S.cumKm.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(S.cumKm[mid]<d)lo=mid+1;else hi=mid;}
  return lo;
}

function animate(){
  if(!S.playing)return;
  const total=S.cumKm[S.cumKm.length-1]||0;
  S.distKm=Math.min(S.distKm+S.speed*KM_PER_SPEED,total);
  const ci=distToIdx(S.distKm);
  S.idx=ci;
  const coords=S.raw.slice(0,ci+1).map(([lo,la])=>[lo,la]);
  map.getSource('route-prog')?.setData({type:'Feature',geometry:{type:'LineString',coordinates:coords}});
  const[lo,la]=S.raw[ci];
  if(S.dotMarker){S.dotMarker.setLngLat([lo,la]);S.dotMarker.getElement().style.display=S.camMode==='chase'?'none':'';}
  if(S.camMode==='follow'){
    map.jumpTo({center:[lo,la]});
  }else if(S.camMode==='3d'){
    const pi=Math.max(0,ci-8);const[plo,pla]=S.raw[pi];
    const bearing=Math.atan2(lo-plo,la-pla)*180/Math.PI;
    map.easeTo({center:[lo,la],bearing,pitch:65,duration:80,easing:t=>t});
  }else if(S.camMode==='chase'){
    const pi=Math.max(0,ci-10);const[plo,pla]=S.raw[pi];
    const bearing=Math.atan2(lo-plo,la-pla)*180/Math.PI;
    // desloca centro 250 m à frente do dot → dot fica na parte inferior
    const fwd=geoOffset(lo,la,bearing,0.25);
    map.easeTo({center:fwd,bearing,pitch:72,zoom:15.5,duration:80,easing:t=>t});
  }
  updateStats();
  document.getElementById('elev-progress').style.width=(total?(S.distKm/total)*100:0)+'%';
  if(S.distKm>=total){pause();return;}
  S.raf=requestAnimationFrame(animate);
}

// ── ELEVATION PROFILE ──────────────────────────────────────────────────────────
function drawElevProfile(){
  const svg=document.getElementById('elev-svg');svg.innerHTML='';
  if(!S.elev.length)return;
  const W=window.innerWidth,H=76;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const mn=Math.min(...S.elev),mx=Math.max(...S.elev);
  const gain=S.elev.reduce((g,e,i)=>i>0&&e>S.elev[i-1]?g+e-S.elev[i-1]:g,0);
  document.getElementById('elev-gain').textContent='+'+Math.round(gain)+'m';
  const pts=S.elev.map((e,i)=>`${(i/(S.elev.length-1))*W},${H-((e-mn)/(mx-mn+1))*(H-10)-4}`).join(' ');
  const area=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  area.setAttribute('points',`0,${H} ${pts} ${W},${H}`);
  area.setAttribute('fill','rgba(230,57,70,.18)');svg.appendChild(area);
  const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  line.setAttribute('points',pts);line.setAttribute('fill','none');
  line.setAttribute('stroke',S.color);line.setAttribute('stroke-width','1.5');svg.appendChild(line);
}

function updateStats(){
  const km=S.cumKm[Math.min(S.idx,S.cumKm.length-1)]||0;
  document.getElementById('s-km').textContent=km.toFixed(1);
  if(S.elev.length){
    const gain=S.elev.slice(0,Math.max(1,S.idx)).reduce((g,e,i)=>i>0&&e>S.elev[i-1]?g+e-S.elev[i-1]:g,0);
    document.getElementById('s-el').textContent=Math.round(gain);
  }
}

// ── COLOR ──────────────────────────────────────────────────────────────────────
function setColor(c){
  S.color=c;
  document.getElementById('color-wrap').style.background=c;
  document.getElementById('color-pick').value=c;
  if(S.dotMarker)S.dotMarker.getElement().style.boxShadow='0 0 12px 4px '+c;
  if(map.isStyleLoaded()){map.setPaintProperty('route-glow','line-color',c);map.setPaintProperty('route-line','line-color',c);}
  drawElevProfile();
}

// ── MAP STYLE ──────────────────────────────────────────────────────────────────
function setMapStyle(styleUrl){
  map.setStyle(styleUrl);
  map.once('style.load',()=>{
    map.addSource('route-full',{type:'geojson',data:emptyLine()});
    map.addSource('route-prog',{type:'geojson',data:emptyLine()});
    map.addLayer({id:'route-full-line',type:'line',source:'route-full',paint:{'line-color':'#ffffff','line-width':2,'line-opacity':0.08}});
    map.addLayer({id:'route-glow',type:'line',source:'route-prog',paint:{'line-color':S.color,'line-width':14,'line-opacity':0.22,'line-blur':6}});
    map.addLayer({id:'route-line',type:'line',source:'route-prog',paint:{'line-color':S.color,'line-width':3,'line-cap':'round','line-join':'round'}});
    if(S.camMode==='3d')setupTerrain();
    if(S.raw.length){
      const coords=S.raw.map(([lo,la])=>[lo,la]);
      map.getSource('route-full').setData({type:'Feature',geometry:{type:'LineString',coordinates:coords}});
      const prog=S.raw.slice(0,S.idx).map(([lo,la])=>[lo,la]);
      map.getSource('route-prog').setData({type:'Feature',geometry:{type:'LineString',coordinates:prog}});
    }
  });
}

// ── CAMERA / TERRAIN ───────────────────────────────────────────────────────────
function setupTerrain(){
  if(!map.getSource('mapbox-dem'))
    map.addSource('mapbox-dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
  map.setTerrain({source:'mapbox-dem',exaggeration:1.5});
  map.setFog({color:'rgb(186,210,235)','high-color':'#245bde','horizon-blend':0.02,'space-color':'#000820','star-intensity':0.6});
}

function setCamMode(mode){
  S.camMode=mode;
  document.querySelectorAll('#btn-cam2d,#btn-camfollow,#btn-cam3d,#btn-camchase').forEach(b=>b.classList.remove('on'));
  const idMap={2d:'btn-cam2d',follow:'btn-camfollow','3d':'btn-cam3d',chase:'btn-camchase'};
  document.getElementById(idMap[mode]||'btn-cam2d').classList.add('on');
  if(mode==='3d'){if(map.isStyleLoaded())setupTerrain();map.easeTo({pitch:65,duration:600});}
  else if(mode==='chase'){if(map.isStyleLoaded())setupTerrain();map.easeTo({pitch:72,duration:600});}
  else{if(map.getTerrain())map.setTerrain(null);map.easeTo({pitch:0,bearing:0,duration:600});}
  // avatar: só aparece no modo chase
  const av=document.getElementById('avatar');
  av.hidden=(mode!=='chase');
  if(mode==='chase')updateAvatarSpeed();
}

function updateAvatarSpeed(){
  // animação mais rápida com velocidade maior; base 0.42s a speed 3
  const dur=Math.max(0.18, 0.42*(3/S.speed))+'s';
  document.querySelectorAll('#av-body-grp,.av-leg-l,.av-leg-r,.av-arm-l,.av-arm-r,#av-head')
    .forEach(el=>el.style.animationDuration=dur);
}

// ── CONTROLS ───────────────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click',()=>S.playing?pause():play());
document.getElementById('btn-rst').addEventListener('click',()=>{
  pause();S.idx=0;S.distKm=0;
  map.getSource('route-prog')?.setData(emptyLine());
  if(S.dotMarker&&S.raw.length)S.dotMarker.setLngLat(S.raw[0]);
  updateStats();document.getElementById('elev-progress').style.width='0';
});
document.getElementById('spd').addEventListener('input',e=>{S.speed=parseInt(e.target.value);document.getElementById('spd-lbl').textContent=S.speed+'×';if(S.camMode==='chase')updateAvatarSpeed();});
document.getElementById('btn-km').addEventListener('click',()=>{S.showKm=!S.showKm;document.getElementById('btn-km').classList.toggle('on',S.showKm);renderKmMarkers();});
document.getElementById('btn-hydra').addEventListener('click',()=>{S.hydraMode=!S.hydraMode;document.getElementById('btn-hydra').classList.toggle('on',S.hydraMode);document.getElementById('hydra-tip').hidden=!S.hydraMode;map.getCanvas().style.cursor=S.hydraMode?'crosshair':'';});
document.getElementById('btn-kml').addEventListener('click',()=>document.getElementById('kml-file').click());
// btn-up e btn-up-main são <label for="gpx-file"> — disparam o input nativamente
document.getElementById('gpx-file').addEventListener('change',e=>{handleFile(e.target.files[0]);e.target.value='';});
document.getElementById('kml-file').addEventListener('change',e=>{handleFile(e.target.files[0]);e.target.value='';});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);});

document.querySelectorAll('.pset').forEach(btn=>{
  btn.addEventListener('click',()=>{setColor(btn.dataset.color);document.querySelectorAll('.pset').forEach(b=>b.classList.remove('on'));btn.classList.add('on');});
});
document.getElementById('color-pick').addEventListener('input',e=>{setColor(e.target.value);document.querySelectorAll('.pset').forEach(b=>b.classList.remove('on'));});

document.querySelectorAll('.stbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('.stbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');setMapStyle(btn.dataset.style);});
});

document.getElementById('btn-cam2d').addEventListener('click',()=>setCamMode('2d'));
document.getElementById('btn-camfollow').addEventListener('click',()=>setCamMode('follow'));
document.getElementById('btn-cam3d').addEventListener('click',()=>setCamMode('3d'));
document.getElementById('btn-camchase').addEventListener('click',()=>{setCamMode('chase');setupTerrain();});

window.addEventListener('resize',()=>drawElevProfile());

function showToast(msg,duration=4000){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),duration);}
} // end startMap

initApp();
</script>
